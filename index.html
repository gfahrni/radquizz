<!doctype html>
<html lang="fr" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RadQuizz — cas radiologiques</title>
<meta name="description" content="Cas radiologiques à parcourir coupe par coupe. Donnez votre diagnostic, en 2 minutes.">

<meta property="og:type" content="website">
<meta property="og:title" content="RadQuizz — cas radiologiques">
<meta property="og:description" content="Parcourez les coupes, donnez votre diagnostic. 2 minutes par cas.">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#f4f5f7" id="meta-theme-color">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23121519'/%3E%3Ccircle cx='12' cy='12' r='6.5' fill='none' stroke='%238fd0ff' stroke-width='1.3'/%3E%3Cpath d='M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3' stroke='%238fd0ff' stroke-width='1.3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<a class="skip-link" href="#reponse">Aller à la zone de réponse</a>

<div class="chrome">
  <div class="chrome-inner">
    <a class="brand" href="#/" aria-label="RadQuizz, accueil">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2.4" fill="currentColor" opacity=".25"/>
      </svg>
      <span class="brand-text">RadQuizz</span>
    </a>

    <nav class="themes" aria-label="Apparence">
      <span class="themes-label">Thème</span>
      <button class="chip" type="button" data-set-theme="classic">Classique</button>
      <button class="chip" type="button" data-set-theme="noel">Noël</button>
    </nav>
  </div>
  <nav class="tabs" id="tabs" aria-label="Séries de cas" hidden></nav>
</div>

<main class="wrap" id="main">

  <header class="intro" id="intro">
    <p class="kicker">Quiz radiologique</p>
    <h1 id="quiz-title">Chargement…</h1>
    <p class="lede" id="quiz-sub"></p>
  </header>

  <div id="panel" class="panel" aria-live="polite">
    <div class="skeleton" aria-hidden="true">
      <div class="sk sk-line short"></div>
      <div class="sk sk-viewer"></div>
      <div class="sk sk-line"></div>
      <div class="sk sk-line short"></div>
    </div>
  </div>

</main>

<footer class="foot">
  <p id="foot-note">RadQuizz — imagerie de démonstration, à visée pédagogique uniquement.</p>
  <noscript><p class="warn">Ce quiz a besoin de JavaScript pour afficher les séries.</p></noscript>
</footer>

<script src="assets/app.js" defer></script>
</body>
</html>
